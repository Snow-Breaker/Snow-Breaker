<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="352" viewBox="0 0 1200 352" fill="none" role="img" aria-labelledby="title"><title id="title">roadmap</title><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#080D19"/><stop offset="1" stop-color="#14243A"/></linearGradient><linearGradient id="a"><stop stop-color="#67E8F9"/><stop offset="1" stop-color="#A78BFA"/></linearGradient><pattern id="g" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" stroke="#B9D9FF" stroke-opacity=".045"/></pattern></defs><rect x="1" y="1" width="1198" height="350" rx="24" fill="url(#bg)" stroke="#26364D"/><rect width="1200" height="352" rx="24" fill="url(#g)"/><g font-family="Segoe UI, Arial, sans-serif"><text x="48" y="51" fill="#A78BFA" font-size="13" letter-spacing="3">02 / WHAT COMES NEXT</text><text x="48" y="96" fill="#F1F6FF" font-size="34" font-weight="600">The roadmap keeps getting bigger.</text><path d="M70 154H1090" stroke="#536F97" stroke-width="2"/><circle cx="70" cy="154" r="7" fill="#67E8F9" stroke="#0B1424" stroke-width="3"/><text x="48" y="204" fill="#EAF3FF" font-size="18" font-weight="600">01 / EXPAND BPT</text><text x="48" y="242" fill="#AFC0D6" font-size="17" >Broader capabilities.</text><text x="48" y="269" fill="#AFC0D6" font-size="17" >A more complete experience.</text><circle cx="446" cy="154" r="7" fill="#67E8F9" stroke="#0B1424" stroke-width="3"/><text x="424" y="204" fill="#EAF3FF" font-size="18" font-weight="600">02 / BUILD FOR ANDROID</text><text x="424" y="242" fill="#AFC0D6" font-size="17" >BPT on a new platform.</text><text x="424" y="269" fill="#AFC0D6" font-size="17" >Connect mobile and PC.</text><circle cx="822" cy="154" r="7" fill="#67E8F9" stroke="#0B1424" stroke-width="3"/><text x="800" y="204" fill="#EAF3FF" font-size="18" font-weight="600">03 / GO BEYOND BPT</text><text x="800" y="242" fill="#AFC0D6" font-size="17" >New ideas. Bigger projects.</text><text x="800" y="269" fill="#AFC0D6" font-size="17" >More ambitious things to build.</text><text x="48" y="322" fill="#8398B4" font-size="12" letter-spacing="1">DIRECTION, NOT A RELEASE SCHEDULE. FOLLOW ALONG AS THE WORK EVOLVES.</text></g></svg>